<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SAMS — Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-host"></div>
<div class="app-shell">

  <div class="topbar">
    <img id="tb-logo" class="logo" style="display:none" alt="Logo">
    <div class="school-name" id="tb-school">SAMS</div>
    <div style="text-align:right">
      <div class="who" id="tb-who">—</div>
    </div>
    <span class="role-pill">Admin</span>
    <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="main container">

    <!-- OVERVIEW -->
    <section class="view active" id="view-overview">
      <div class="section-title"><h2>School Overview</h2></div>
      <div class="grid cols-3" id="stat-tiles"></div>
      <div class="card mt-24">
        <div class="section-title"><h2>Sections at a glance</h2></div>
        <div id="overview-sections"></div>
      </div>
    </section>

    <!-- SECTIONS -->
    <section class="view" id="view-sections">
      <div class="section-title">
        <h2>Sections</h2>
        <div class="actions"><button class="btn" id="add-section-btn">+ New Section</button></div>
      </div>
      <div class="card"><div id="sections-list"></div></div>
    </section>

    <!-- TEACHERS -->
    <section class="view" id="view-teachers">
      <div class="section-title">
        <h2>Teachers</h2>
        <div class="actions"><button class="btn" id="add-teacher-btn">+ New Teacher</button></div>
      </div>
      <div class="card"><div id="teachers-list"></div></div>
    </section>

    <!-- STUDENTS -->
    <section class="view" id="view-students">
      <div class="section-title">
        <h2>Students</h2>
        <div class="actions"><button class="btn" id="add-student-btn">+ New Student</button></div>
      </div>
      <div class="card">
        <div class="field-row" style="margin-bottom:14px">
          <div class="field"><label>Filter by section</label>
            <select id="student-filter-section"><option value="">All sections</option></select>
          </div>
          <div class="field"><label>Search</label>
            <input type="text" id="student-search" placeholder="Name or LRN">
          </div>
        </div>
        <div id="students-list"></div>
      </div>
    </section>

    <!-- SCANNER -->
    <section class="view" id="view-scanner">
      <div class="section-title"><h2>Gate Scanner</h2></div>
      <div class="scanner-wrap">
        <p class="text-soft text-sm">Point the camera at a student's QR ID. Time-in is recorded automatically.</p>
        <div id="qr-reader"></div>
        <div class="mt-16">
          <button class="btn secondary" id="scanner-toggle">Start Scanner</button>
        </div>
        <div class="scan-result" id="scan-result"></div>
      </div>
    </section>

    <!-- REPORTS -->
    <section class="view" id="view-reports">
      <div class="section-title"><h2>Attendance Report</h2></div>
      <div class="card">
        <div class="field-row">
          <div class="field"><label>Section</label>
            <select id="report-section"><option value="">Whole school</option></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Start date</label><input type="date" id="report-start"></div>
          <div class="field"><label>End date</label><input type="date" id="report-end"></div>
        </div>
        <button class="btn" id="report-generate">Generate &amp; Download CSV</button>
        <p class="hint mt-8" id="report-hint"></p>
      </div>

      <div class="card mt-16">
        <div class="section-title"><h2>Daily Roster</h2></div>
        <div class="date-select-row">
          <input type="date" id="day-select">
          <select id="day-section-filter"><option value="">All sections</option></select>
        </div>
        <div id="day-roster"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <div class="section-title"><h2>School Settings</h2></div>
      <div class="card">
        <div class="photo-picker" id="logo-picker">
          <img class="avatar" style="border-radius:12px" alt="School logo">
          <div>
            <button type="button" class="btn secondary sm pick-btn">Upload Logo</button>
            <input type="file" accept="image/*">
          </div>
        </div>
        <div class="field mt-16"><label>School name</label><input type="text" id="settings-school-name"></div>
        <div class="field"><label>Late cutoff time (24h)</label><input type="text" id="settings-late-cutoff" placeholder="08:00"></div>
        <button class="btn" id="settings-save">Save Settings</button>
      </div>
      <div class="card mt-16">
        <div class="section-title"><h2>My Account</h2></div>
        <div class="field"><label>Current password</label><input type="password" id="pw-old"></div>
        <div class="field"><label>New password</label><input type="password" id="pw-new"></div>
        <button class="btn secondary" id="pw-save">Change Password</button>
      </div>
    </section>

  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Overview
    </button>
    <button class="tab-btn" data-view="sections">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
      Sections
    </button>
    <button class="tab-btn" data-view="teachers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Teachers
    </button>
    <button class="tab-btn" data-view="students">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><circle cx="18" cy="8" r="2.6"/><path d="M16.5 15.2c2.7.4 4.5 2.2 4.5 5.8"/></svg>
      Students
    </button>
    <button class="tab-btn" data-view="scanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><rect x="9" y="9" width="6" height="6"/></svg>
      Scan
    </button>
    <button class="tab-btn" data-view="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 19h16"/></svg>
      Reports
    </button>
    <button class="tab-btn" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.2.5.7 1 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
      Settings
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
