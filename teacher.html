<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SAMS — Teacher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-host"></div>
<div class="app-shell">

  <div class="topbar">
    <img id="tb-logo" class="logo" style="display:none" alt="Logo">
    <div class="school-name" id="tb-school">SAMS</div>
    <div style="text-align:right">
      <div class="who" id="tb-who">—</div>
    </div>
    <span class="role-pill">Teacher</span>
    <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="main container">

    <!-- OVERVIEW -->
    <section class="view active" id="view-overview">
      <div class="section-title"><h2>My Class Overview</h2></div>
      <div id="no-section-msg" class="empty-state" style="display:none">
        <div class="big">🏫</div>You haven't been assigned to a section yet. Ask your admin to assign you.
      </div>
      <div class="grid cols-3" id="stat-tiles"></div>
    </section>

    <!-- STUDENTS -->
    <section class="view" id="view-students">
      <div class="section-title">
        <h2>My Students</h2>
        <div class="actions">
          <button class="btn secondary" id="import-students-btn">Bulk Import</button>
          <button class="btn secondary" id="bulk-qr-btn">Bulk QR Print</button>
          <button class="btn" id="add-student-btn">+ New Student</button>
        </div>
      </div>
      <div class="card">
        <div class="field mt-8" id="section-picker-wrap" style="display:none">
          <label>Section</label>
          <select id="student-section-filter"></select>
        </div>
        <div class="field"><label>Search</label><input type="text" id="student-search" placeholder="Name or LRN"></div>
        <div id="students-list"></div>
      </div>
    </section>

    <!-- DAILY STATUS -->
    <section class="view" id="view-day">
      <div class="section-title"><h2>Daily Status</h2></div>
      <div class="card">
        <div class="date-select-row"><input type="date" id="day-select"></div>
        <div id="day-roster"></div>
      </div>
    </section>

    <!-- SCANNER -->
    <section class="view" id="view-scanner">
      <div class="section-title"><h2>Classroom Scanner</h2></div>
      <div class="scanner-wrap">
        <p class="text-soft text-sm">Scan a student's QR ID to record their time-in for your class.</p>
        <div id="qr-reader"></div>
        <div class="mt-16 flex gap-8" style="justify-content:center">
          <button class="btn secondary" id="scanner-toggle">Start Scanner</button>
          <button class="btn secondary" id="scanner-fullscreen-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            Full Screen
          </button>
        </div>
        <div class="scan-result" id="scan-result"></div>
      </div>
    </section>

    <!-- REPORTS -->
    <section class="view" id="view-reports">
      <div class="section-title"><h2>Class Attendance Report</h2></div>
      <div class="card">
        <div class="field-row">
          <div class="field"><label>Start date</label><input type="date" id="report-start"></div>
          <div class="field"><label>End date</label><input type="date" id="report-end"></div>
        </div>
        <button class="btn" id="report-generate">Generate &amp; Download CSV</button>
        <p class="hint mt-8" id="report-hint"></p>
      </div>
    </section>

    <!-- ACCOUNT -->
    <section class="view" id="view-account">
      <div class="section-title"><h2>My Account</h2></div>
      <div class="card">
        <div class="photo-picker" id="me-photo"><img class="avatar" alt=""><div><button type="button" class="btn secondary sm pick-btn">Upload Photo</button><input type="file" accept="image/*"></div></div>
        <button class="btn secondary sm mt-16" id="me-photo-save">Save Photo</button>
      </div>
      <div class="card mt-16">
        <div class="field"><label>Current password</label><input type="password" id="pw-old"></div>
        <div class="field"><label>New password</label><input type="password" id="pw-new"></div>
        <button class="btn secondary" id="pw-save">Change Password</button>
      </div>
    </section>

  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Overview
    </button>
    <button class="tab-btn" data-view="students">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><circle cx="18" cy="8" r="2.6"/><path d="M16.5 15.2c2.7.4 4.5 2.2 4.5 5.8"/></svg>
      Students
    </button>
    <button class="tab-btn" data-view="day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      Roster
    </button>
    <button class="tab-btn" data-view="scanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><rect x="9" y="9" width="6" height="6"/></svg>
      Scan
    </button>
    <button class="tab-btn" data-view="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 19h16"/></svg>
      Reports
    </button>
    <button class="tab-btn" data-view="account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Account
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
